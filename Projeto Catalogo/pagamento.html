<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento - CatalogoFlix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./img/logo2.png" type="image/x-icon">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-3">Pagamento</h3>
    <form>
      <input type="text" class="form-control mb-3" placeholder="Número do Cartão" required>
      <input type="text" class="form-control mb-3" placeholder="Validade (MM/AA)" required>
      <input type="text" class="form-control mb-3" placeholder="CVV" required>
      <button class="btn btn-success w-100">Finalizar Compra</button>
    </form>
  </div>

</body>
</html>
